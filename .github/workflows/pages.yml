name: Публикация сайта (GitHub Pages)

on:
  push:
    branches: [claude/gorbushkin-dvor-pavilion-map-ifzjc5, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать сайт
        run: |
          mkdir -p _site
          # the game pages are written without the document skeleton; add it for the open web, with each game's own
          # home-screen icon and name (without them a phone borrows the icon of another site on 20-3-3.github.io)
          page() {
            printf '<!doctype html>\n<html lang="ru">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'
            printf '<meta name="theme-color" content="#0e1014">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="mobile-web-app-capable" content="yes">\n'
            printf '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n<meta name="apple-mobile-web-app-title" content="%s">\n' "$2"
            printf '<link rel="apple-touch-icon" href="%s">\n<link rel="icon" type="image/png" href="%s">\n<link rel="manifest" href="%s">\n' "$3" "$3" "$4"
            cat "$1"
            printf '\n</html>\n'
          }
          page novaya-gorbushka-3d.html 'Горбушка' icon-180.png manifest.webmanifest > _site/index.html
          page staraya-gorbushka-3d.html 'Ст. Горбушка' staraya-180.png staraya.webmanifest > _site/staraya.html
          cp novaya-gorbushka-model.json site/* _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
