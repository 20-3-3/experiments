<title>Новая Горбушка 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a full-screen landscape game. The 3D view fills the screen, a thin HUD floats on top:
   place chip top-left, tool buttons top-right, joystick bottom-left, run button bottom-right. */
:root {
  --hud: rgba(16, 18, 22, 0.72);
  --hud-strong: rgba(16, 18, 22, 0.9);
  --fg: #ffffff;
  --muted: #b8bfca;
  --line: rgba(255, 255, 255, 0.16);
  --red: #d71920;
  --font: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: #0e1014; color: var(--fg); font-family: var(--font); overflow: hidden; overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
[hidden] { display: none !important; }
#game { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#gl { display: block; width: 100%; height: 100%; }
.hud { position: absolute; z-index: 5; }
.tl { left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); display: grid; gap: 6px; justify-items: start; }
.tr { right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); display: grid; gap: 8px; justify-items: end; }
.bl { left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.br { right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; justify-items: end; }
.chip { background: var(--hud); border: 1px solid var(--line); border-radius: 10px; padding: 6px 11px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(6px); }
.chip .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,0.75); }
.chip.small { font-size: 11px; font-weight: 500; color: var(--muted); padding: 4px 9px; border-radius: 8px; }
.tools { display: flex; gap: 6px; }
.btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--hud); color: var(--fg);
  display: grid; place-items: center; cursor: pointer; padding: 0; backdrop-filter: blur(6px);
}
.btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
.btn.mine { color: #ffd400; border-color: rgba(255, 212, 0, 0.55); }
.btn.mine svg { fill: #ffd400; }
.btn:focus-visible, .pill:focus-visible, #q:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#minimap { width: 200px; height: 240px; border-radius: 12px; border: 1px solid var(--line); background: #1b1e24; }
#joy { width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,0.10); border: 2px solid rgba(255,255,255,0.45); position: relative; touch-action: none; }
#knob { position: absolute; left: 38px; top: 38px; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.88); box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
#run { width: 76px; height: 76px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); background: rgba(215,25,32,0.78); color: #fff; font: 700 15px var(--font); touch-action: none; cursor: pointer; }
#run[aria-pressed="true"] { background: #ff2b33; box-shadow: 0 0 0 4px rgba(255,43,51,0.35); }
#toast {
  left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-width: min(520px, 56vw);
  background: var(--hud-strong); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; display: flex; gap: 10px; align-items: center;
  pointer-events: none;
}
#toast .sec { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
#toast b { font-size: 16px; font-variant-numeric: tabular-nums; }
#toast span { color: var(--muted); font-size: 12.5px; display: block; }
#cross { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; pointer-events: none; z-index: 4; }
#cross::before, #cross::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 3px rgba(0,0,0,0.9); }
#cross::before { left: 7px; top: 0; width: 2px; height: 16px; }
#cross::after { top: 7px; left: 0; height: 2px; width: 16px; }
.bc { left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; background: var(--hud-strong); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
.pill { font: 600 14px var(--font); color: #fff; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 8px 13px; cursor: pointer; }
.pill[aria-pressed="true"] { background: #fff; color: #111; }
.pill.go { background: var(--red); }
#search {
  position: absolute; z-index: 8; top: calc(64px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
  width: min(360px, 80vw); max-height: 70vh; background: var(--hud-strong); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 8px;
}
#q { font: 500 15px var(--font); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0f1115; color: #fff; }
#results { overflow-y: auto; max-height: 52vh; display: grid; gap: 4px; }
#results button { text-align: left; font: 500 14px var(--font); color: #fff; background: rgba(255,255,255,0.06); border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
#results button i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
#results small { color: var(--muted); }
.overlay { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: #0e1014; text-align: center; padding: 24px; }
.overlay h2 { font-size: 20px; margin: 14px 0 6px; }
.overlay p { color: var(--muted); margin: 0 0 16px; max-width: 32ch; line-height: 1.45; }
.overlay button { font: 700 15px var(--font); color: #fff; background: var(--red); border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer; }
.phone { width: 64px; height: 104px; border: 4px solid #fff; border-radius: 14px; margin: 0 auto; animation: turn 2.2s ease-in-out infinite; }
@keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
@media (prefers-reduced-motion: reduce) { .phone { animation: none; transform: rotate(-90deg); } }
#hint { left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); max-width: min(520px, 46vw); background: var(--hud-strong); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 13px; color: var(--muted); pointer-events: none; text-align: center; }
.bar { height: 4px; width: 180px; background: #262a31; border-radius: 4px; overflow: hidden; margin: 14px auto 0; }
.bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width 0.2s; }
@media (max-height: 430px) {
  #minimap { width: 150px; height: 180px; }
  #joy { width: 112px; height: 112px; } #knob { left: 31px; top: 31px; width: 50px; height: 50px; }
  #run { width: 64px; height: 64px; font-size: 13px; }
  .btn { width: 40px; height: 40px; }
}
</style>

<div id="game">
  <canvas id="gl"></canvas>

  <div class="hud tl">
    <div class="chip" id="where"><i class="dot" id="whereDot"></i><span id="whereText">Улица</span></div>

  </div>
  <div class="hud tr">

      <button class="btn" id="bMap" type="button" aria-pressed="true" aria-label="Карта" title="Карта (M)">
        <svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>

  <div class="hud bl" id="joyWrap"><div id="joy"><div id="knob"></div></div></div>

  <div class="hud" id="toast" hidden></div>
  <div class="hud bc" id="orbitBar" hidden>
    <button class="pill" type="button" id="cut1" aria-pressed="false">1 этаж</button>
    <button class="pill" type="button" id="cut2" aria-pressed="false">2 этаж</button>

    <div id="results"></div>
  </div>
  <div class="hud" id="hint" hidden>Джойстик слева — идти · тяни экран — смотреть · ★ — к моему павильону</div>
  <div class="overlay" id="rotate" hidden>
    <div><div class="phone"></div><h2>Поверни телефон горизонтально</h2><p>Игра рассчитана на горизонтальный экран.</p><button type="button" id="rotOk">Играть так</button></div>
  </div>
  <div class="overlay" id="loading"><div><h2>Новая Горбушка</h2><p id="loadText">Загружаю здание…</p><div class="bar"><i id="loadBar"></i></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
'use strict';
// ============================================================== constants
const SECTOR = { A: '#9999cc', B: '#00b1e3', C: '#009846', D: '#dcd527', E: '#8d599f', F: '#f3c12d', G: '#f39314', H: '#e11e24' };
const DARK_TEXT = { D: 1, F: 1 };
const H2 = 5.2;            // floor 2 level
const CEIL1 = 4.95;        // floor 1 ceiling (under the floor 2 slab)
const CEIL_A = 4.3;        // ceiling of the A wing (old brick building)
const ROOF = 12.5, ROOF_IN = 12.0, AW_TOP = 23.0, AW_SHELL_FROM = 4.3;   // AW_SHELL_FROM: where the brick starts on the A wing
const KIND_H = { pavilion: 3.0, kiosk: 2.3, store: 4.2, cafe: 3.0 };
const EYE = 1.65, RADIUS = 0.28, STEP = 0.45, WALK = 4.0, RUN = 8.5, GRAV = 22;
const ICON_NAMES = { wc: 'Туалет', atm: 'Банкомат', cafe: 'Кафе', buffet: 'Буфет', info: 'Информация', stairs: 'Лестница', escalator: 'Эскалатор', exchange: 'Обмен валюты' };

const $ = id => document.getElementById(id);
const game = $('game'), canvas = $('gl');
const coarse = window.matchMedia('(pointer: coarse)').matches;

// ============================================================== renderer
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, coarse ? 1.5 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;      // filmic response: highlights roll off like a photo
renderer.toneMappingExposure = 0.8;
const SHADOWS = !coarse;                                   // sun shadows on computers; phones keep the frame rate
renderer.shadowMap.enabled = SHADOWS;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xd4dde3);
const FOG = new THREE.Fog(HORIZON, 140, 700);
scene.fog = FOG;
const camera = new THREE.PerspectiveCamera(68, 1, 0.05, 2500);
camera.rotation.order = 'YXZ';
const controls = new THREE.OrbitControls(camera, canvas);
controls.enabled = false; controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.48; controls.minDistance = 10; controls.maxDistance = 700;
// light: soft reflections of a bright room for glass, metal and glossy tiles; sky, sun and an overhead fill
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
const SKY_ENV = (() => {   // what the windows outside reflect: sky above the horizon, ground below
  const sc = new THREE.Scene(), g = new THREE.SphereGeometry(50, 32, 16), pos = g.attributes.position, cols = [], c = new THREE.Color();
  const top = new THREE.Color(0x4f86c6), mid = new THREE.Color(0x9fc1e0), gnd = new THREE.Color(0x55524c);
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 50;
    if (y < -0.02) c.copy(gnd); else if (y < 0.2) c.copy(HORIZON).lerp(mid, Math.max(0, y) / 0.2); else c.copy(mid).lerp(top, Math.min(1, (y - 0.2) / 0.6));
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  sc.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  return pmrem.fromScene(sc, 0.02).texture;
})();
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x6c665d, 0.3));
const SUN_DIR = new THREE.Vector3(-0.42, 0.78, 0.47).normalize();
const sun = new THREE.DirectionalLight(0xfff0d8, 1.5);
sun.position.copy(SUN_DIR).multiplyScalar(300); scene.add(sun, sun.target);
if (SHADOWS) {
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -55, right: 55, top: 55, bottom: -55, near: 10, far: 700 });
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.05;
}
const fill = new THREE.DirectionalLight(0xfff7ec, 0.4); fill.position.set(0.1, 1, 0.05); scene.add(fill);   // overhead lamps
// the shadow map covers the area around the player (or the whole view from above), snapped to its texels so edges do not crawl
const SH_F = SUN_DIR.clone().negate(), SH_R = new THREE.Vector3().crossVectors(SH_F, new THREE.Vector3(0, 1, 0)).normalize();
const SH_U = new THREE.Vector3().crossVectors(SH_R, SH_F).normalize(), shC = new THREE.Vector3();
function aimSun(cx, cz, R) {
  if (SHADOWS) {
    const cam = sun.shadow.camera;
    if (cam.right !== R) { cam.left = cam.bottom = -R; cam.right = cam.top = R; cam.updateProjectionMatrix(); }
  }
  const texel = 2 * R / 2048; shC.set(cx, 0, cz);
  const a = Math.round(shC.dot(SH_R) / texel) * texel, b = Math.round(shC.dot(SH_U) / texel) * texel, d = shC.dot(SUN_DIR);
  sun.target.position.copy(SH_R).multiplyScalar(a).addScaledVector(SH_U, b).addScaledVector(SUN_DIR, d);
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 300);
}
let indoor = 0;   // 0 outside .. 1 inside: indoors the light comes from the lamps, not the sun
const sky = (() => {   // gradient sky dome that travels with the camera
  const g = new THREE.SphereGeometry(2000, 40, 20), pos = g.attributes.position, cols = [];
  const top = new THREE.Color(0x4f86c6), mid = new THREE.Color(0x9fc1e0), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 2000;
    if (y < 0) c.copy(HORIZON); else if (y < 0.22) c.copy(HORIZON).lerp(mid, y / 0.22); else c.copy(mid).lerp(top, Math.min(1, (y - 0.22) / 0.6));
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, toneMapped: false, depthWrite: false }));
  m.renderOrder = -10; m.frustumCulled = false; scene.add(m); return m;
})();

// ============================================================== helpers
const V2 = (x, z) => new THREE.Vector2(x, -z);
function shapeOf(pts, holes) {
  const s = new THREE.Shape(pts.map(([x, z]) => V2(x, z)));
  (holes || []).forEach(h => s.holes.push(new THREE.Path(h.map(([x, z]) => V2(x, z)))));
  return s;
}
function extrude(pts, depth, y0, holes) {
  const g = new THREE.ExtrudeGeometry(shapeOf(pts, holes), { depth, bevelEnabled: false });
  g.rotateX(-Math.PI / 2); g.translate(0, y0, 0);
  return g;
}
function flat(pts, y, holes, down) {
  const g = new THREE.ShapeGeometry(shapeOf(pts, holes));
  g.rotateX(down ? Math.PI / 2 : -Math.PI / 2);
  if (down) g.scale(1, 1, -1);
  g.translate(0, y, 0);
  return g;
}
function sidesOnly(g) { g.groups = g.groups.filter(gr => gr.materialIndex === 1); return g; }
function pip(x, z, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], zi = pts[i][1], xj = pts[j][0], zj = pts[j][1];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
const bboxOf = pts => {
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (const [x, z] of pts) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (z < z0) z0 = z; if (z > z1) z1 = z; }
  return { x0, x1, z0, z1, cx: (x0 + x1) / 2, cz: (z0 + z1) / 2 };
};
const rand = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const merge = geos => THREE.BufferGeometryUtils.mergeBufferGeometries(geos, false);
function boxGeo(w, h, d, x, y, z, ry) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (ry) g.rotateY(ry);
  g.translate(x, y, z); return g;
}
function segBox(x0, z0, x1, z1, y0, h, t) {   // a wall-like box along a segment
  const len = Math.hypot(x1 - x0, z1 - z0);
  const g = new THREE.BoxGeometry(len, h, t);
  g.rotateY(-Math.atan2(z1 - z0, x1 - x0));
  g.translate((x0 + x1) / 2, y0 + h / 2, (z0 + z1) / 2);
  return g;
}

// ============================================================== textures: procedural, with normal maps (after the 2024-2026 photos)
const T = {};
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function toTex(c, rep, color) {
  const t = new THREE.CanvasTexture(c);
  if (color !== false) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (rep) t.repeat.set(1 / rep[0], 1 / rep[1]);
  return t;
}
function canvasTex(w, h, draw, rep) { const c = cv(w, h); draw(c.getContext('2d'), w, h); return toTex(c, rep); }
// height map (grey canvas, light = high) -> tangent-space normal map
function normalFromHeight(hc, strength) {
  const w = hc.width, h = hc.height, src = hc.getContext('2d').getImageData(0, 0, w, h).data;
  const out = cv(w, h), ctx = out.getContext('2d'), img = ctx.createImageData(w, h), d = img.data;
  const H = (x, y) => src[((((y + h) % h) * w) + ((x + w) % w)) * 4];

  const DOOR_H = 3.0;
  const F = { siding: new GB(), plinth: new GB(), stone: new GB(), granite: new GB(), brick: new GB(), parapet: new GB(), reveal: new GB(), soffit: new GB(), inner: new GB() };
  const windows = { glass: [], glassCol: [], frame: [], surround: [], ac: [], shopGlass: [], shopFrame: [] };
  const pipes = [], cornice = [];
  // door openings: stretches of each skin's arc length, worked out by tools/fronts.py (a ray from the door outwards)
  const OPEN = { main: [], awing: [] };
  M.doors.forEach(d => {
    const o = d.opening; if (!o) return;
    o.spans.forEach(([a, b]) => OPEN[o.ring].push([a, b, o.depth, o.axis[0], o.axis[1], o.hit[0], o.hit[1]]));
    d._skin = { x: o.hit[0], z: o.hit[1], nx: o.n[0], nz: o.n[1] };
  });
  for (const k in OPEN) {                                  // doors side by side share one opening
    const L = OPEN[k].sort((p, q) => p[0] - q[0]), out = [];
    for (const o of L) { const q = out[out.length - 1]; if (q && o[0] <= q[1] + 0.6) { q[1] = Math.max(q[1], o[1]); q[2] = Math.max(q[2], o[2]); } else out.push(o.slice()); }
    OPEN[k] = out;
  }
  const facade = (ring, shared, isMain, opens) => {
    const E = ringEdges(ring), innerTop = (isMain ? CEIL1 : CEIL_A) + 0.3;
    let c0 = 0;
    E.forEach((e, i) => {
      const P = t => [e.a[0] + e.ux * t, e.a[1] + e.uz * t], u = c0, c1 = c0 + e.L;
      c0 = c1;
      if (shared[i]) {                                     // the side where the hall meets the brick block
        if (!isMain) F.brick.v(e.a[0], e.a[1], e.b[0], e.b[1], ROOF, AW_TOP - 0.6, e.nx, e.nz, u);
        return;
      }
      // openings on this edge, in metres from its start: [t0, t1, depth, opening starts here, opening ends here]
      const ops = opens.filter(o => o[1] > u + 1e-3 && o[0] < c1 - 1e-3)
        .map(o => [Math.max(0, o[0] - u), Math.min(e.L, o[1] - u), o[2], o[0] >= u - 1e-3, o[1] <= c1 + 1e-3, o[3], o[4], o[5], o[6]]);
      const solid = []; let c = 0;
      for (const [t0, t1] of ops) { if (t0 > c + 1e-3) solid.push([c, t0]); c = Math.max(c, t1); }
      if (c < e.L - 1e-3) solid.push([c, e.L]);
      for (const [t0, t1] of solid) {                       // lower band between the doors, and its back
        const [x0, z0] = P(t0), [x1, z1] = P(t1);
        if (isMain) { F.plinth.v(x0, z0, x1, z1, 0, 0.45, e.nx, e.nz, u + t0); F.siding.v(x0, z0, x1, z1, 0.45, DOOR_H, e.nx, e.nz, u + t0); }
        else { F.granite.v(x0, z0, x1, z1, 0, 0.6, e.nx, e.nz, u + t0); F.stone.v(x0, z0, x1, z1, 0.6, DOOR_H, e.nx, e.nz, u + t0); }
        F.inner.v(x0, z0, x1, z1, 0, innerTop, -e.nx, -e.nz, u + t0);
        addCollider(segPts(x0, z0, x1, z1, 0.15), { lvl: 1 });
      }
      for (const [t0, t1, depth, starts, ends, vx, vz, hx, hz] of ops) {   // reveals and soffit of each opening, along the door
        for (const [t, here] of [[t0, starts], [t1, ends]]) {
          if (!here) continue;                             // the opening runs on round a bend of the skin
          const [x, z] = P(t);
          let rx = -vz, rz = vx; if ((hx - x) * rx + (hz - z) * rz < 0) { rx = -rx; rz = -rz; }   // faces into the opening
          F.reveal.v(x, z, x - vx * depth, z - vz * depth, 0, DOOR_H, rx, rz);
          addCollider(segPts(x, z, x - vx * depth, z - vz * depth, 0.12), { lvl: 1 });
        }
        const [ax, az] = P(t0), [bx, bz] = P(t1);
        F.soffit.h([ax, az], [bx, bz], [ax - vx * depth, az - vz * depth], [bx - vx * depth, bz - vz * depth], DOOR_H, false);
        F.inner.v(ax, az, bx, bz, DOOR_H, innerTop, -e.nx, -e.nz, u + t0);
      }
      const [x0, z0] = P(0), [x1, z1] = P(e.L);
      if (isMain) {
        F.siding.v(x0, z0, x1, z1, DOOR_H, ROOF - 0.6, e.nx, e.nz, u);
        F.parapet.v(x0, z0, x1, z1, ROOF - 0.6, ROOF + 0.25, e.nx, e.nz, u);
        F.parapet.v(x0, z0, x1, z1, ROOF, ROOF + 0.25, -e.nx, -e.nz, u);   // its back, seen from the roof
      } else {
        F.stone.v(x0, z0, x1, z1, DOOR_H, AW_SHELL_FROM, e.nx, e.nz, u);
        F.brick.v(x0, z0, x1, z1, AW_SHELL_FROM, AW_TOP - 0.6, e.nx, e.nz, u);
        cornice.push([(x0 + x1) / 2 + e.nx * 0.16, AW_TOP - 0.3, (z0 + z1) / 2 + e.nz * 0.16, e.L + 0.3, 0.62, 0.34, -Math.atan2(e.ez, e.ex)]);
        // windows of the five upper storeys and shop windows of the ground floor, on a 3.3 m bay
        if (e.L >= 4) {
          const nb = Math.floor((e.L - 1.6) / 3.3), start = (e.L - nb * 3.3) / 2 + 1.65, ry = Math.atan2(e.nx, e.nz);
          for (let k = 0; k < nb; k++) {
            const t = start + k * 3.3, [wx, wz] = P(t);
            for (let s = 0; s < 5; s++) {
              const yc = AW_SHELL_FROM + s * 3.6 + 1.0 + 0.9, seed = i * 131 + k * 17 + s * 7;
              windows.glass.push([wx + e.nx * 0.02, yc, wz + e.nz * 0.02, 1.42, 1.72, 1, ry]);
              windows.glassCol.push(rand(seed) < 0.3 ? 0xd8d0bf : rand(seed + 1) < 0.5 ? 0x3c4c5c : 0x2b3642);
              windows.frame.push([wx, yc, wz, 1, 1, 1, ry]);
              windows.surround.push([wx, yc, wz, 1, 1, 1, ry]);
              if (rand(seed + 2) < 0.28) windows.ac.push([wx + e.ux * 0.95 + e.nx * 0.2, yc - 1.15, wz + e.uz * 0.95 + e.nz * 0.2, 0.82, 0.56, 0.3, ry]);
            }
            if (!ops.some(([t0, t1]) => t > t0 - 1.6 && t < t1 + 1.6) && !behindLetters(wx, wz)) {
              windows.shopGlass.push([wx + e.nx * 0.03, 2.05, wz + e.nz * 0.03, 2.7, 2.4, 1, ry]);
              windows.shopFrame.push([wx, 2.05, wz, 1, 1, 1, ry]);
            }
          }
        }
      }
      // downpipes at the corners and every 25 m
      const top = isMain ? ROOF : AW_TOP;
      for (let t = 0; t < e.L; t += 25) if (!ops.some(([t0, t1]) => t > t0 - 0.6 && t < t1 + 0.6)) {
        const [px, pz] = P(t + (t === 0 ? 0.35 : 0));
        pipes.push([px + e.nx * 0.2, top / 2, pz + e.nz * 0.2, 1, top, 1, 0]);
      }
    });
  };
  facade(M.volumes.main_skin, M.volumes.main_skin_shared, true, OPEN.main);
  facade(M.volumes.awing_skin, M.volumes.awing_skin_shared, false, OPEN.awing);

  const fm = {
    siding: mat.siding, plinth: mat.concrete, stone: mat.wall, granite: new THREE.MeshStandardMaterial({ color: 0x3b3d41, roughness: 0.35, metalness: 0.1 }),
    brick: mat.brick, parapet: mat.red, reveal: mat.wallDouble, soffit: mat.wall, inner: mat.wall,
  };
  for (const [k, gb] of Object.entries(F)) { const m = gb.mesh(fm[k]); if (m) { m.castShadow = m.receiveShadow = true; groups.shell.add(m); } }

  // window parts, built once and instanced (local +z points out of the wall)
  const frameGeo = merge([boxGeo(1.5, 0.07, 0.08, 0, 0.86, 0.04), boxGeo(1.5, 0.07, 0.08, 0, -0.86, 0.04), boxGeo(0.07, 1.8, 0.08, -0.72, 0, 0.04),
    boxGeo(0.07, 1.8, 0.08, 0.72, 0, 0.04), boxGeo(0.06, 1.72, 0.07, 0.05, 0, 0.045), boxGeo(1.42, 0.06, 0.07, 0, 0.42, 0.045)]);
  const surroundGeo = merge([boxGeo(1.86, 0.18, 0.16, 0, 1.0, 0.08), boxGeo(1.9, 0.07, 0.26, 0, -0.95, 0.13), boxGeo(0.14, 1.9, 0.12, -0.86, 0, 0.06), boxGeo(0.14, 1.9, 0.12, 0.86, 0, 0.06)]);
  const shopFrameGeo = merge([boxGeo(2.8, 0.09, 0.1, 0, 1.24, 0.05), boxGeo(2.8, 0.09, 0.1, 0, -1.24, 0.05), boxGeo(0.09, 2.5, 0.1, -1.36, 0, 0.05),
    boxGeo(0.09, 2.5, 0.1, 1.36, 0, 0.05), boxGeo(0.07, 2.4, 0.08, 0, 0, 0.05), boxGeo(2.7, 0.06, 0.08, 0, 0.55, 0.05)]);
  const glassMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.06, metalness: 0.55, envMap: SKY_ENV, envMapIntensity: 1.2 });
  const shopGlassMat = new THREE.MeshStandardMaterial({ color: 0x1f2a33, roughness: 0.05, metalness: 0.6, envMap: SKY_ENV, envMapIntensity: 1.4 });
  const pvc = new THREE.MeshStandardMaterial({ color: 0xf2f2f0, roughness: 0.5 });
  const sill = new THREE.MeshStandardMaterial({ color: 0xd9d2c4, roughness: 0.8 });
  const parts = [
    instanced(new THREE.PlaneGeometry(1, 1), glassMat, windows.glass, windows.glassCol),
    instanced(frameGeo, pvc, windows.frame), instanced(surroundGeo, sill, windows.surround),
    instanced(UNIT_BOX, new THREE.MeshStandardMaterial({ color: 0xe9e9e6, roughness: 0.6 }), windows.ac),
    instanced(new THREE.PlaneGeometry(1, 1), shopGlassMat, windows.shopGlass), instanced(shopFrameGeo, mat.darkSteel, windows.shopFrame),
    instanced(UNIT_BOX, sill, cornice), instanced(new THREE.CylinderGeometry(0.08, 0.08, 1, 10), new THREE.MeshStandardMaterial({ color: 0x8a8f95, roughness: 0.4, metalness: 0.6 }), pipes),
  ];
  parts.forEach(m => { if (m) { m.castShadow = true; groups.shell.add(m); } });

  // roof of the hall: membrane, skylight ridges along the bays, air-conditioning units and vents
  const mb = bboxOf(mainPoly), sky = [], units = [], vents = [];
  for (let z = mb.z0 + 12; z < mb.z1 - 6; z += 12) {
    let a = null, b = null;
    for (let x = mb.x0; x <= mb.x1; x += 1) if (pip(x, z, mainPoly)) { if (a === null) a = x; b = x; }
    if (a === null || b - a < 12) continue;
    sky.push([(a + b) / 2, ROOF + 0.35, z, b - a - 8, 0.7, 2.2, 0]);
  }
  for (let k = 0; k < 14; k++) {
    const x = mb.x0 + 10 + rand(k * 3.1) * (mb.x1 - mb.x0 - 20), z = mb.z0 + 6 + rand(k * 7.7) * (mb.z1 - mb.z0 - 12);
    if (!pip(x, z, mainPoly)) continue;
    units.push([x, ROOF + 0.8, z, 2.4, 1.6, 1.4, 0]); vents.push([x + 3, ROOF + 0.6, z + 1, 1, 1.2, 1, 0]);
  }
  const skyMat = new THREE.MeshStandardMaterial({ color: 0xbfd6e6, roughness: 0.1, metalness: 0.3, envMap: SKY_ENV, envMapIntensity: 1.2 });
  [instanced(UNIT_BOX, skyMat, sky), instanced(UNIT_BOX, new THREE.MeshStandardMaterial({ color: 0xd8dadc, roughness: 0.5, metalness: 0.3 }), units),
    instanced(new THREE.CylinderGeometry(0.35, 0.35, 1, 14), mat.steel, vents)].forEach(m => { if (m) { m.castShadow = true; groups.roof.add(m); } });
}

// ============================================================== columns of the building's grid, through both floors
function buildColumns(mat) {
  const mb = bboxOf(mainPoly), cols1 = [], cols2 = [], tall = [], ext = [];
  const roomAt = (x, z, lvl) => (grid.get(Math.floor(x / CELL) * 100000 + Math.floor(z / CELL)) || [])
    .some(c => c.room && c.lvl === lvl && x >= c.x0 && x <= c.x1 && z >= c.z0 && z <= c.z1 && pip(x, z, c.pts));
  const clear = (x, z, lvl) => {   // a column standing in a corridor must leave room to pass on both sides
    const feet = lvl === 2 ? H2 : 0;
    for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; if (blocked(x + Math.cos(a) * 1.5, z + Math.sin(a) * 1.5, feet)) return false; }
    return true;
  };
  for (let z = mb.z0 + 6; z < mb.z1 - 3; z += 12) for (let x = mb.x0 + 6; x < mb.x1 - 3; x += 12) {
    if (!pip(x, z, mainPoly) || nearLink(x, z, 1.2)) continue;
    let ok = true;
    for (const p of [[0.6, 0.6], [-0.6, 0.6], [0.6, -0.6], [-0.6, -0.6]]) if (!pip(x + p[0], z + p[1], mainPoly)) ok = false;
    if (!ok) continue;
    if (M.rooms.some(r => r.kind === 'stage' && pip(x, z, r.poly))) continue;
    const s2 = onSlab(x, z);
    const in1 = roomAt(x, z, 1), in2 = s2 && roomAt(x, z, 2);
    if (!in1 && !clear(x, z, 1)) continue;
    if (s2 && !in2 && !clear(x, z, 2)) continue;
    if (s2) { cols1.push([x, CEIL1 / 2, z, 0.5, CEIL1, 0.5, 0]); cols2.push([x, (H2 + 9.4) / 2, z, 0.5, 9.4 - H2, 0.5, 0]); }
    else tall.push([x, 9.4 / 2, z, 0.5, 9.4, 0.5, 0]);   // in a light well the column runs up to the trusses
    addCollider(rectPts(x, z, 0.56, 0.56, 0), { lvl: 0 });
    if (!in1 && rand(x * 3.3 + z) < 0.5) ext.push([x + 0.33, 0.3, z, 1, 0.56, 1, 0]);    // fire extinguisher at the column
  }
  const colMat = new THREE.MeshStandardMaterial({ map: T.wallPanel, normalMap: T.wallPanelN, color: 0xf4f3f0, roughness: 0.7 });
  [instanced(UNIT_BOX, colMat, cols1), instanced(UNIT_BOX, colMat, tall)].forEach(m => { if (m) groups.f1.add(m); });
  const m2 = instanced(UNIT_BOX, colMat, cols2); if (m2) groups.f2.add(m2);
  const red = instanced(new THREE.CylinderGeometry(0.09, 0.09, 1, 12), new THREE.MeshStandardMaterial({ color: 0xc81e1e, roughness: 0.35, metalness: 0.2 }), ext);
  if (red) groups.f1.add(red);
  return cols1.length + cols2.length + tall.length;
}

// ============================================================== sidewalk curbs and parking stall lines
function buildStreetDetails(mat) {
  const curbs = [], lines = [];
  for (const s of (M.exterior.sidewalk || [])) for (const e of ringEdges(s.poly)) {
    if (e.L < 0.3) continue;
    curbs.push([(e.a[0] + e.b[0]) / 2 + e.nx * 0.09, 0.05, (e.a[1] + e.b[1]) / 2 + e.nz * 0.09, e.L + 0.05, 0.1, 0.18, -Math.atan2(e.ez, e.ex)]);
  }
  for (const p of M.exterior.parking) {
    const E = ringEdges(p.poly).sort((a, b) => b.L - a.L), e = E[0];
    if (!e || e.L < 8) continue;
    const width = Math.max(...p.poly.map(q => Math.abs((q[0] - e.a[0]) * e.nx + (q[1] - e.a[1]) * e.nz)));
    for (let t = 1.5; t < e.L - 1.5; t += 2.7) for (const d0 of [0.3, width - 5.3]) {
      if (d0 < 0 || width < 6) continue;
      const x = e.a[0] + e.ux * t - e.nx * (d0 + 2.5), z = e.a[1] + e.uz * t - e.nz * (d0 + 2.5);
      lines.push([x, 0.02, z, 0.12, 0.012, 5, -Math.atan2(e.ez, e.ex)]);
    }
  }
  const c = instanced(UNIT_BOX, new THREE.MeshStandardMaterial({ map: T.concrete, color: 0xc9c9c6, roughness: 0.9 }), curbs);
  const l = instanced(UNIT_BOX, new THREE.MeshBasicMaterial({ color: 0xe8e8e8 }), lines);
  if (c) { c.receiveShadow = true; groups.ext.add(c); }
  if (l) groups.ext.add(l);
}

// ============================================================== exit signs over the doors, inside
function buildExitSigns() {
  const proto = signPlane(['ВЫХОД'], '#0a8a3a', '#ffffff', 0.3, {});
  M.doors.forEach(d => {
    if (d.kind !== 'entrance' || !d.opening) return;
    const [dx, dz] = d.dir, inA = pip(d.pos[0] + dx * 2, d.pos[1] + dz * 2, awingPoly);
    const s = proto.clone();
    s.position.set(d.pos[0] + dx * 0.6, inA ? 3.3 : 3.4, d.pos[1] + dz * 0.6); s.rotation.y = Math.atan2(dx, dz);
    groups.f1.add(s);
  });
}

function onSlab(x, z) {
  for (const s of slab2) if (pip(x, z, s.poly) && !s.holes.some(h => pip(x, z, h))) return true;
  return false;
}

// ============================================================== roof structure
function buildRoofStructure(mat) {
  const mb = bboxOf(mainPoly);
  const dummy = new THREE.Object3D();
  const members = [];   // [x0,y0,z0,x1,y1,z1,thickness]
  const span = (z) => {   // x-range of the hall at this z
    let a = null, b = null;
    for (let x = mb.x0; x <= mb.x1; x += 1) { if (pip(x, z, mainPoly)) { if (a === null) a = x; b = x; } }
    return a === null ? null : [a + 0.6, b - 0.6];
  };
  const yb = 9.4, yt = 11.7;
  for (let z = mb.z0 + 6; z < mb.z1 - 3; z += 12) {
    const r = span(z); if (!r) continue;
    const [x0, x1] = r, n = Math.floor((x1 - x0) / 3);
    members.push([x0, yb, z, x1, yb, z, 0.18], [x0, yt, z, x1, yt, z, 0.2]);
    for (let k = 0; k <= n; k++) {
      const x = x0 + k * (x1 - x0) / n;
      members.push([x, yb, z, x, yt, z, 0.1]);
      if (k < n) { const xn = x0 + (k + 1) * (x1 - x0) / n; members.push(k % 2 ? [x, yb, z, xn, yt, z, 0.09] : [x, yt, z, xn, yb, z, 0.09]); }
    }
  }
  for (let x = mb.x0 + 4; x < mb.x1 - 2; x += 9) {   // purlins
    let a = null, b = null;
    for (let z = mb.z0; z <= mb.z1; z += 1) if (pip(x, z, mainPoly)) { if (a === null) a = z; b = z; }
    if (a !== null) members.push([x, yt + 0.15, a + 0.6, x, yt + 0.15, b - 0.6, 0.12]);
  }
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const inst = new THREE.InstancedMesh(geo, mat.truss, members.length);
  const up = new THREE.Vector3(1, 0, 0), dir = new THREE.Vector3(), q = new THREE.Quaternion();
  members.forEach((m, i) => {
    const [x0, y0, z0, x1, y1, z1, t] = m;
    dir.set(x1 - x0, y1 - y0, z1 - z0); const len = dir.length(); dir.normalize();
    q.setFromUnitVectors(up, dir);
    dummy.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); dummy.quaternion.copy(q); dummy.scale.set(len, t, t);
    dummy.updateMatrix(); inst.setMatrixAt(i, dummy.matrix);
  });
  groups.roof.add(inst);
  // silver ducts under the trusses (floor 2) and under the ceiling (floor 1)
  const ducts2 = [], ducts1 = [], tubes = [];
  for (let z = mb.z0 + 12; z < mb.z1 - 6; z += 24) {
    const r = span(z); if (!r) continue;
    const g = new THREE.CylinderGeometry(0.42, 0.42, r[1] - r[0], 14); g.rotateZ(Math.PI / 2); g.translate((r[0] + r[1]) / 2, 8.9, z); ducts2.push(g);
  }
  for (let z = mb.z0 + 9; z < mb.z1 - 4; z += 18) {
    const r = span(z); if (!r) continue;
    const g = new THREE.CylinderGeometry(0.24, 0.24, r[1] - r[0], 12); g.rotateZ(Math.PI / 2); g.translate((r[0] + r[1]) / 2, 4.62, z); ducts1.push(g);
  }
  for (let z = mb.z0 + 3; z < mb.z1 - 2; z += 6) {   // hanging fluorescent lines on floor 2
    const r = span(z); if (!r) continue;
    for (let x = r[0] + 1; x < r[1] - 1.5; x += 3.2) tubes.push(boxGeo(1.4, 0.06, 0.14, x + 0.7, 8.6, z));
  }
  if (ducts2.length) groups.roof.add(new THREE.Mesh(merge(ducts2), mat.duct));
  if (ducts1.length) groups.f1ceil.add(new THREE.Mesh(merge(ducts1), mat.duct));
  if (tubes.length) groups.roof.add(new THREE.Mesh(merge(tubes), mat.tube));
}

// ============================================================== photo-based details inside
function roomByCode(code, rooms) { return (rooms || M.rooms.concat(M.floor2.rooms)).find(r => r.codes.includes(code)); }
// how far you can see in front of a shop front on its own floor (light wells count as open)
function openness(level, x, z, nx, nz) {
  let d = 0.4;
  for (; d < 14; d += 0.4) {
    const px = x + nx * d, pz = z + nz * d;
    if (!pip(px, pz, M.footprint)) break;
    const list = grid.get(Math.floor(px / CELL) * 100000 + Math.floor(pz / CELL)) || [];
    let hit = false;
    for (const c of list) {
      if (!((c.room && c.lvl === level) || (c.wall && level === 1))) continue;
      if (px >= c.x0 && px <= c.x1 && pz >= c.z0 && pz <= c.z1 && pip(px, pz, c.pts) && !c.holes.some(h => pip(px, pz, h))) { hit = true; break; }
    }
    if (hit) break;
  }
  return d;
}
// the front a shop shows to its main corridor: long and facing open space
function frontOf(r) {
  if (!r || !r.fronts || !r.fronts.length) return null;
  if (r._front) return r._front;
  let best = r.fronts[0], bs = -1;
  for (const f of r.fronts) {
    const [x1, z1, x2, z2, nx, nz] = f;
    const s = Math.min(Math.hypot(x2 - x1, z2 - z1), 12) * openness(r.level, (x1 + x2) / 2, (z1 + z2) / 2, nx, nz);
    if (s > bs) { bs = s; best = f; }
  }
  return (r._front = best);
}
function hangingSign(lines, bg, fg, code, out, y, opts, level) {
  const r = roomByCode(code); const f = frontOf(r); if (!f) return;
  const [x1, z1, x2, z2, nx, nz] = f;
  const s = signPlane(lines, bg, fg, (opts && opts.h) || 0.55, opts || {});
  s.position.set((x1 + x2) / 2 + nx * out, ((level || r.level) === 2 ? H2 : 0) + y, (z1 + z2) / 2 + nz * out);
  s.rotation.y = Math.atan2(-nz, nx) + Math.PI / 2;   // across the corridor
  (r.level === 2 ? groups.f2 : groups.f1).add(s);
  const rod = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.8, 0.03), window.__mat.darkSteel);
  rod.position.set(s.position.x, s.position.y + 0.6, s.position.z); (r.level === 2 ? groups.f2 : groups.f1).add(rod);
}
function topSign(lines, bg, fg, code, opts) {   // big signage box on top of a kiosk (photo 2026, under the gallery)
  const r = roomByCode(code); const f = frontOf(r); if (!f) return;
  const [x1, z1, x2, z2, nx, nz] = f;
  const s = signPlane(lines, bg, fg, (opts && opts.h) || 0.75, Object.assign({ maxW: Math.hypot(x2 - x1, z2 - z1) + 0.6 }, opts || {}));
  placeOnWall(s, (x1 + x2) / 2, (z1 + z2) / 2, nx, nz, (r.level === 2 ? H2 : 0) + r.h + 0.45, 0.1);
  (r.level === 2 ? groups.f2 : groups.f1).add(s);
}

// ============================================================== collision grid & surfaces
const CELL = 6, grid = new Map();
let indexed = 0;
function indexColliders() {
  colliders.slice(indexed).forEach(c => {
    for (let gx = Math.floor(c.x0 / CELL); gx <= Math.floor(c.x1 / CELL); gx++)
      for (let gz = Math.floor(c.z0 / CELL); gz <= Math.floor(c.z1 / CELL); gz++) {
        const k = gx * 100000 + gz; if (!grid.has(k)) grid.set(k, []); grid.get(k).push(c);
      }
  });
  indexed = colliders.length;
}
function rampH(L, x, z) {
  const t = ((x - L.a[0]) * L.dx + (z - L.a[1]) * L.dz) / L.len;
  return Math.max(0, Math.min(1, t)) * H2;
}
function nearLink(x, z, pad) {     // on a flight, beside it, or in the 1.5 m in front of its bottom step
  return links.some(L => {
    const t = (x - L.a[0]) * L.dx + (z - L.a[1]) * L.dz, s = -(x - L.a[0]) * L.dz + (z - L.a[1]) * L.dx;
    return t >= -pad - 1.5 && t <= L.len + pad && Math.abs(s) <= L.w / 2 + pad;
  });
}
function inLink(L, x, z, pad) {
  const t = (x - L.a[0]) * L.dx + (z - L.a[1]) * L.dz, s = -(x - L.a[0]) * L.dz + (z - L.a[1]) * L.dx;
  return t >= -(pad || 0) && t <= L.len + (pad || 0) && Math.abs(s) <= L.w / 2;
}
function hitsAt(x, z, feet) {
  const list = grid.get(Math.floor(x / CELL) * 100000 + Math.floor(z / CELL));
  if (!list) return false;
  const lvl = feet > H2 - 0.9 ? 2 : 1;
  for (const c of list) {
    if (x < c.x0 || x > c.x1 || z < c.z0 || z > c.z1) continue;
    if (c.link) { if (inLink(c.link, x, z) && Math.abs(rampH(c.link, x, z) - feet) > STEP) return true; continue; }
    if (c.rail) { if (lvl === 2 && pip(x, z, c.pts)) return true; continue; }
    if (c.lvl && c.lvl !== lvl) continue;
    if (pip(x, z, c.pts) && !c.holes.some(h => pip(x, z, h))) return true;
  }
  return false;
}
const PROBES = [[0, 0]].concat([...Array(8)].map((_, i) => [Math.cos(i * Math.PI / 4) * RADIUS, Math.sin(i * Math.PI / 4) * RADIUS]));
function blocked(x, z, feet) {
  if (Math.abs(x) > 420 || Math.abs(z - 30) > 420) return true;
  for (const [dx, dz] of PROBES) if (hitsAt(x + dx, z + dz, feet)) return true;
  return false;
}
function groundAt(x, z, feet) {
  let best = 0;
  if (onSlab(x, z) && H2 <= feet + STEP) best = H2;
  const list = grid.get(Math.floor(x / CELL) * 100000 + Math.floor(z / CELL)) || [];
  for (const c of list) if (c.link && inLink(c.link, x, z)) { const h = rampH(c.link, x, z); if (h <= feet + STEP && h > best) best = h; }
  return best;
}

let lastLook = 0, lookedAt = null;
function stepWalk(dt) {

  if (keys.has('KeyA')) side -= 1;

    else if (!blocked(player.x + sx, player.z, player.y)) player.x += sx;
    else if (!blocked(player.x, player.z + sz, player.y)) player.z += sz;
    const g = groundAt(player.x, player.z, player.y);
    if (g > player.y) { player.y = g; player.vy = 0; }
  }
  const g = groundAt(player.x, player.z, player.y);

    camera.lookAt(hx - sy * 3, player.y + 1.35 + player.pitch * 2.4, hz - cy * 3);
  }
  // what are we looking at: march along the view direction on the current floor
  const now = performance.now();
  if (now - lastLook > 150) {
    lastLook = now;
    let found = null;
    for (let d = 0.6; d < 18 && !found; d += 0.35) {
      const x = player.x - sy * d, z = player.z - cy * d;
      const list = grid.get(Math.floor(x / CELL) * 100000 + Math.floor(z / CELL)); if (!list) continue;
      for (const c of list) {
        if (!c.room || c.lvl !== lvl) { if (c.lvl === lvl && !c.room && !c.link && !c.rail && pip(x, z, c.pts)) { d = 99; break; } continue; }
        if (x >= c.x0 && x <= c.x1 && z >= c.z0 && z <= c.z1 && pip(x, z, c.pts)) { found = c.room; break; }
      }
    }
    if (found !== lookedAt) { lookedAt = found; if (!selected || found) showRoom(found || selected); }
    const w = whereAmI();
    if (w.text !== lastWhere) { lastWhere = w.text; whereText.textContent = w.text; whereDot.style.background = w.color; recon.hidden = w.lvl !== 2; }
  }
  updateLabels();
  drawMinimap();
}

// ============================================================== loop, sizing, start
function resize() {
  const w = game.clientWidth, h = game.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  $('rotate').hidden = !(coarse && h > w && !rotDismissed);
}
let rotDismissed = false;
$('rotOk').onclick = () => { rotDismissed = true; resize(); };
window.addEventListener('resize', resize);
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'orbit') controls.update(); else stepWalk(dt);
  sky.position.copy(camera.position);
  if (mode === 'walk') aimSun(player.x, player.z, 55);
  else aimSun(controls.target.x, controls.target.z, Math.min(260, Math.max(70, camera.position.distanceTo(controls.target) * 0.8)));
  const cp = camera.position, ins = cp.y < ROOF && (pip(cp.x, cp.z, mainPoly) || pip(cp.x, cp.z, awingPoly)) ? 1 : 0;
  indoor += (ins - indoor) * Math.min(1, dt * 3);
  sun.intensity = 1.5 - 1.25 * indoor; fill.intensity = 0.05 + 0.75 * indoor;
  if (beacon) {   // the marker over the owner's pavilion stays readable from far away
    const k = Math.max(1, Math.min(8, camera.position.distanceTo(beacon.position) / 16));
    beacon.scale.set(beacon.userData.w * k, beacon.userData.h * k, 1);
    beacon.position.y = beacon.userData.y + (k - 1) * 0.5;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

async function start() {
  const bar = $('loadBar'), txt = $('loadText');
  try {
    bar.style.width = '15%';
    const res = await fetch('novaya-gorbushka-model.json');
    if (!res.ok) throw new Error('model ' + res.status);
    M = await res.json();
    bar.style.width = '45%'; txt.textContent = 'Строю 2 этажа и фасады…';
    await new Promise(r => setTimeout(r, 30));
    if (document.fonts && document.fonts.load) await Promise.all([document.fonts.load('800 40px "Golos Text"'), document.fonts.load('600 20px "Golos Text"')]).catch(() => {});
    build(); indexColliders(); setupMine(); buildMinimap();
    bar.style.width = '90%';
    SPAWN = computeSpawn();
    Object.assign(player, SPAWN, { y: 0 });
    resize(); setMode('walk'); applyView();
    $('loading').hidden = true;
    hint.hidden = false; hintTimer = setTimeout(hideHint, 9000);
    requestAnimationFrame(t => { last = t; tick(t); });
  } catch (e) {
    txt.textContent = 'Не удалось загрузить модель: ' + e.message;
    console.error(e);
  }
}
start();
</script>
